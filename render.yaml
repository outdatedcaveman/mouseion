services:
  - type: web
    name: zoterpile
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 120 "zoterpile.web:app"
    envVars:
      - key: ZOTERPILE_API_KEY
        generateValue: true
      - key: RENDER
        value: "true"
